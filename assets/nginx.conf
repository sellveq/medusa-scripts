map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Routing template; ${LMA_*} substituted by the nginx image's envsubst at start.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;

    location = /nginx-health { return 200; }

    # bare /admin is the API base; only the exact path redirects to the UI
    location = /admin { return 301 /app; }

    location ~ ^/(app|admin|auth|store|hooks|health)(/|$) {
        proxy_pass http://host.docker.internal:${LMA_BACKEND_PORT};
    }

    location / {
        proxy_pass http://host.docker.internal:${LMA_STOREFRONT_PORT};
    }
}
