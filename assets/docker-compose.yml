name: ${LMCA_COMPOSE_PROJECT:-app}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${LMCA_COMPOSE_PROJECT:-app}-postgres
    ports:
      - "${LMCA_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${LMCA_DB_USER:-app}
      POSTGRES_PASSWORD: ${LMCA_DB_PASSWORD:-app}
      POSTGRES_DB: ${LMCA_DB_NAME:-app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LMCA_DB_USER:-app} -d ${LMCA_DB_NAME:-app}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  proxy:
    image: nginx:1.27-alpine
    container_name: ${LMCA_COMPOSE_PROJECT:-app}-proxy
    ports:
      - "${LMCA_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      LMCA_BACKEND_PORT: ${LMCA_BACKEND_PORT:-9000}
      LMCA_STOREFRONT_PORT: ${LMCA_STOREFRONT_PORT:-8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: ${LMCA_COMPOSE_PROJECT:-app}-redis
    ports:
      - "${LMCA_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
