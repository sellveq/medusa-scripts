name: Bug report
description: Report a defect in lma (@selveq/medusa-scripts)
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of lma misbehaves?
      options:
        - stack lifecycle (start / stop / restart / destroy / status)
        - port allocation (lma ports)
        - database (import-db / dump-db / reset-db / psql)
        - migrate / seed-admin
        - dev servers (backend / storefront startup, logs)
        - proxy / nginx routing
        - tunnel (setup / start / quick / stop)
        - init / install (scaffolding, npm scripts, postinstall)
        - other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, what you expected instead, and the exact command you ran with its terminal output.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps from a known state (e.g. fresh `lma init`, or `lma destroy` then `lma start`) to the failure.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: lma.js
      description: Your project's lma.js (redact real passwords and tunnel hostnames if needed).
      render: js
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "Whatever applies: `lma status`, `lma logs backend|storefront`, `lma logs` (containers), `lma tunnel logs`, or `lma ports`."
      render: shell
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Node 20.11, Docker 27, macOS 15 / Ubuntu 24.04"
    validations:
      required: true
